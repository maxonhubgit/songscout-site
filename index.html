<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="Share the songs you love with your friends.">
  <meta name="referrer" content="no-referrer">
  <title>SongScout</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/styles.css?v=5">
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <img class="app-icon" src="assets/icon-512.png" alt="SongScout app icon" width="104" height="104">
      <h1>SongScout</h1>
      <p>Share the songs you love with your friends.</p>
      <div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <span class="pill">Coming soon to the App Store</span>
      <a class="scroll-hint" href="#showcase">Take a closer look <span aria-hidden="true">↓</span></a>
    </section>
  </main>
  <section class="scrolly" id="showcase" aria-label="Inside SongScout">
    <div class="sticky">
      <div class="scene-heading">
        <p class="eyebrow">Inside SongScout</p>
        <h2 data-scene-title>Headphones on.</h2>
      </div>
      <div class="scene-viewport" role="img" aria-label="Illustration: a person with headphones holds a phone with SongScout. The view moves over their shoulder to the screen, where the feed scrolls and cards lift out as they pass.">
        <div class="phone-preview" aria-hidden="true"><canvas></canvas></div>
        <canvas class="scene-canvas" aria-hidden="true"></canvas>
      </div>
      <div class="scene-caption">
        <p data-scene-description>Your friends are already sharing.</p>
        <div class="scene-progress" aria-hidden="true"><span></span></div>
        <span class="scene-note">App preview · Sample content<span class="motion-hint"> · Scroll to explore</span></span>
      </div>
    </div>
    <noscript><p class="wrap">Enable JavaScript to explore the app preview.</p></noscript>
  </section>
  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; 2026 SongScout</span>
      <nav>
        <a href="support.html">Support</a>
        <a href="privacy.html">Privacy</a>
        <a href="datenschutz.html">Datenschutz</a>
        <a href="impressum.html">Impressum</a>
      </nav>
    </div>
  </footer>
  <script type="module" src="assets/main.js?v=6"></script>
</body>
</html>
